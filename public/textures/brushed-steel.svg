<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="steel">
    <feTurbulence type="fractalNoise" baseFrequency="0.4,0.01" numOctaves="5" seed="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.15" intercept="0.1"/>
      <feFuncG type="linear" slope="0.15" intercept="0.1"/>
      <feFuncB type="linear" slope="0.15" intercept="0.1"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#steel)"/>
</svg>
